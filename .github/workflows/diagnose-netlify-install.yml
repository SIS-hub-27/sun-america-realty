name: Diagnose Netlify install

on:
  push:
    branches:
      - diagnose-netlify-install
    paths:
      - ".github/workflows/diagnose-netlify-install.yml"
      - "package.json"
      - "vite.config.ts"
      - "netlify.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Show tool versions
        run: |
          node --version
          npm --version
          npm config get registry

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit generated lockfile to diagnostic branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Generate working npm lockfile"
          git push
