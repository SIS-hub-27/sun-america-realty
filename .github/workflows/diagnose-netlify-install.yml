name: Diagnose Netlify install

on:
  push:
    branches:
      - diagnose-netlify-install
    paths:
      - ".github/workflows/diagnose-netlify-install.yml"
      - "package-lock.json"
      - "package.json"
      - "vite.config.ts"
      - "netlify.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Clean install from committed lockfile
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
